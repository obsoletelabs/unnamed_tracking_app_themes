name: Theme packages
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/themes.yml
      - run: python -m pip install ruff pylint
      - run: ruff check tools tests
      - run: ruff format --check tools tests
      - run: pylint --fail-under=9 tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_themes.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-dist
          path: unsigned-dist/
          if-no-files-found: error
